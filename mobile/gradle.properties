# Force Gradle to use JDK 21 Temurin — NOT the JDK 26 that may be on PATH.
# Kotlin 2.x and Gradle 8.x do not support JDK 26 (toolchain mismatch).
# If the build fails with "Unsupported class file major version" or
# "Your build is currently configured to use Java 26", this property is the fix.
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.12.101-hotspot

# Gradle performance
org.gradle.daemon=true
org.gradle.parallel=true
